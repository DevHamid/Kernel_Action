display:
  tool_progress: all
  tool_progress_command: true
  platforms:
    telegram:
      tool_progress: all
auxiliary:
  vision:
    provider: 'custom:9router-shifu'
    model: openrouter/nvidia/nemotron-3.5-super-vl:free
    base_url: http://192.168.1.1:20128/v1
plugins:
  enabled:
    - omh
    - progress-thread-redirect
    - dag-bubble-forward
  disabled: []
  load_timeout_seconds: 30
  entries:
    omh:
      settings:
        omh_home: '/opt/data/profiles/shifu/home/.omh'
approvals:
  destructive_slash_confirm: false
  mode: "off"

skills:
  external_dirs:
    - /opt/data/profiles/shifu/home/.omh/skills

memory:
  provider: omh
