_config_version: 52
agent:
  compression_threshold: 0.85
  generate_titles: false
  reasoning_effort: high
model:
  default: devhamidrobot
  provider: custom
  base_url: https://9router.devhamid.space/v1
  api_key: ${HERMES_CUSTOM_9ROUTER_DEVHAMID_SPACE_API_KEY}
onboarding:
  seen:
    busy_input_prompt: true
    tool_progress_prompt: true
gateway:
  require_mention: true
  standalone: true
command_allowlist:
  - copy/move file into sensitive credential/SSH/shell-rc path
  - delete in root path
  - execute_code
  - git force push (rewrites remote history)
  - git force push short flag (rewrites remote history)
  - git reset --hard (destroys uncommitted changes)
  - overwrite system file via redirection
  - recursive delete
  - script execution via -e/-c flag
  - script execution via heredoc
  - stop/restart hermes gateway (kills running agents)
known_plugin_toolsets:
  acp:
    - homeassistant
  webhook:
    - homeassistant
  cli:
    - a2a
    - spotify
  telegram:
    - a2a
    - spotify
_left_core_scoped:
  - homeassistant
_left_core_installed:
  - homeassistant
telemetry:
  shared_metrics:
    enabled: true
    send: false
    offer_version: 2
multiplex_profiles: true
messaging:
  telegram:
    channels:
      - name: main
        token: 8962617248:AAFsNGCtEISMT1sIsMD7Ne0QXC4tyMubCa4
        allowed_users:
          - 410848670
      - name: secondary
        token: 8660324510:AAGrahq5Kyon2feRsKKZyWW-ers90x3HBN4
        allowed_users:
          - 410848670
    extra:
      bots_require_mention: true
require_mention: true
telegram:
