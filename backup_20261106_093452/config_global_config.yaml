    - "-1003628710660:478"
  ignored_threads:
    - 441
    - 418
  mention_patterns:
    - '@devhamidrobot'
    - '(?i)\bdev\b'
    - '(?i)\bhello\s+guys?\b'
    - '(?i)\bhi\s+guys?\b'
    - '(?i)\bhello\s+dudes?\b'
    - '(?i)\bhi\s+dudes?\b'
    - '(?i)\bhey\s+guys?\b'
    - '(?i)\bhey\s+dudes?\b'
    - '(?i)\bhello\s+everyone\b'
    - '(?i)\bhi\s+everyone\b'
